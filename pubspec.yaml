name: dorakpattient
description: Patient-App
publish_to: 'none'

version: 1.0.3+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sizer: ^2.0.15
  flutter_svg: ^2.0.7
  flutter_rating_bar: ^4.0.1
  get_it: ^7.2.0
  connectivity_plus: ^3.0.2
  shared_preferences: ^2.0.15
  quiver: ^3.2.1
  dio: ^5.7.0
  retrofit: ^4.4.0
  geolocator: ^14.0.3
  geocoding: ^3.0.0
  fluttertoast: ^8.1.2
  cached_network_image: ^3.2.3
  url_launcher: ^6.1.10
  flutter_launcher_icons: ^0.12.0
  easy_localization: ^3.0.1
  firebase_messaging: ^16.7.0
  firebase_core: ^4.15.0
  flutter_local_notifications: ^19.4.0
  permission_handler: ^12.0.1
  flutter_easyloading: ^3.0.5
  share_plus: ^13.3.0
  json_annotation: ^4.8.1
  go_router: ^14.6.2
  injectable: ^2.5.0
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.1.5
  retrofit_generator: ^10.0.2
  injectable_generator: ^2.6.2
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  change_app_package_name: ^1.1.0

dependency_overrides:
  args: ^2.6.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "path/to/image.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/intro/
    - assets/images/home/
    - assets/images/doctor/
    - assets/translations/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Bold.ttf
        - asset: assets/fonts/Tajawal-Light.ttf
        - asset: assets/fonts/Tajawal-Regular.ttf
